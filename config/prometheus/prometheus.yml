# Coleta de métricas de todos os componentes da plataforma
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    ambiente: local
    projeto: case-saude

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # --- Observabilidade ---
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]

  # --- Infraestrutura: CPU/memória de cada container ---
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]

  # --- Armazenamento ---
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: silo-cluster
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{ targets: ["silo:9000"] }]
  - job_name: silo-buckets
    metrics_path: /minio/v2/metrics/bucket
    static_configs: [{ targets: ["silo:9000"] }]

  # --- Streaming: tópicos, offsets e consumer lag ---
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]

  # --- Processamento ---
  - job_name: spark-master
    metrics_path: /metrics/master/prometheus
    static_configs: [{ targets: ["spark-master:8080"] }]
  - job_name: spark-aplicacoes
    metrics_path: /metrics/applications/prometheus
    static_configs: [{ targets: ["spark-master:8080"] }]
  # Workers escalam dinamicamente: descoberta via DNS do Docker
  - job_name: spark-workers
    metrics_path: /metrics/prometheus
    dns_sd_configs:
      - names: ["spark-worker"]
        type: A
        port: 8081

  # --- Orquestração (Airflow via StatsD) ---
  - job_name: airflow
    static_configs: [{ targets: ["statsd-exporter:9102"] }]
