# =============================================================
# Regras de autenticação do PostgreSQL (avaliadas de cima para baixo)
# =============================================================
# TYPE      DATABASE     USER  ADDRESS        METHOD

# Socket local (apenas dentro do container: healthcheck e administração)
local       all          all                  trust

# Conexões pela rede SEM TLS: sempre recusadas
hostnossl   all          all   0.0.0.0/0      reject
hostnossl   replication  all   0.0.0.0/0      reject

# Conexões pela rede COM TLS: senha com SCRAM-SHA-256
hostssl     all          all   0.0.0.0/0      scram-sha-256
hostssl     replication  all   0.0.0.0/0      scram-sha-256
