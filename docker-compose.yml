# =============================================================
# Case Saúde — stack de dados
# Serviços são agrupados em profiles (ver COMPOSE_PROFILES no .env)
# Configurações são montadas sempre como PASTAS: no Docker Desktop com WSL,
# montagens de arquivo individual quebram quando o arquivo é substituído ou
# quando o Docker reinicia (o container falha com código 127).
# =============================================================

# Configuração comum aos containers do Spark
x-spark-common: &spark-common
  build:
    context: ./docker
    dockerfile: spark/Dockerfile
  image: case-saude/spark:4.1.2
  profiles: ["processing"]
  restart: unless-stopped
  environment: &spark-env
    # Usuário de serviço do pipeline (política por camada), não o root do Silo
    AWS_ACCESS_KEY_ID: svc-pipeline
    AWS_SECRET_ACCESS_KEY: ${SILO_PIPELINE_SECRET}
    AWS_REGION: us-east-1
    SPARK_WORKER_DIR: /opt/spark/work-dir
  volumes:
    - ./jobs:/opt/jobs:ro
    - ./tests:/opt/tests:ro
  networks: [datanet]

# Configuração comum aos containers do Airflow
x-airflow-common: &airflow-common
  build:
    context: ./docker
    dockerfile: airflow/Dockerfile
  image: case-saude/airflow:3.3.2
  profiles: ["orchestration"]
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow?sslmode=require
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: case-saude
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Métricas via StatsD -> statsd-exporter -> Prometheus
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: 9125
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # Conexão com o cluster Spark (client mode: driver no Airflow)
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077, "extra": {"deploy-mode": "client"}}'
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./jobs:/opt/jobs:ro
    - airflow_logs:/opt/airflow/logs
  networks: [datanet]

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------
  # PostgreSQL — metadados (Airflow, Metabase), DW e OLTP de origem
  # ---------------------------------------------------------
  postgres:
    image: postgres:17
    profiles: ["core"]
    restart: unless-stopped
    # Instala o certificado com as permissões exigidas e chama o entrypoint oficial
    entrypoint: ["/bin/bash", "/scripts/postgres-entrypoint.sh"]
    command:
      - postgres
      # CDC com Debezium
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      # Criptografia em trânsito (TLS 1.2+) e regras de acesso (sem TLS = recusado)
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - ssl_cert_file=/etc/postgresql/tls/postgres.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/postgres.key
      - -c
      - hba_file=/etc/postgresql/custom/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      # Auditoria: conexões e mudanças de estrutura vão para o log (e para o Loki)
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      DW_DB_PASSWORD: ${DW_DB_PASSWORD}
      OLTP_DB_PASSWORD: ${OLTP_DB_PASSWORD}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./certs:/certs-src:ro
      - ./config/postgres:/etc/postgresql/custom:ro
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging
    networks: [datanet]

  # ---------------------------------------------------------
  # Silo (fork comunitário do MinIO) — object storage S3 do lakehouse
  # ---------------------------------------------------------
  silo:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    profiles: ["core"]
    restart: unless-stopped
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Métricas liberadas para o Prometheus (fase 7)
      MINIO_PROMETHEUS_AUTH_TYPE: public
      # Chave mestra do KMS: criptografia em repouso (SSE-S3) dos objetos
      MINIO_KMS_SECRET_KEY: ${SILO_KMS_KEY}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging
    networks: [datanet]

  # Aplica schemas, papéis e tabelas de referência do DW (idempotente) e encerra
  db-setup:
    image: postgres:17
    profiles: ["core"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/db-setup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
      PGSSLMODE: require
    volumes:
      - ./scripts:/scripts:ro
      - ./sql/cluster:/sql/cluster:ro
      - ./sql/dw:/sql/dw:ro
    logging: *default-logging
    networks: [datanet]

  # Cria os buckets do lakehouse e encerra
  silo-init:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    profiles: ["core"]
    restart: "no"
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SILO_PIPELINE_SECRET: ${SILO_PIPELINE_SECRET}
      SILO_INGESTAO_SECRET: ${SILO_INGESTAO_SECRET}
      SILO_ANALISTA_SECRET: ${SILO_ANALISTA_SECRET}
    volumes:
      - ./scripts:/scripts:ro
      - ./config/silo/politicas:/politicas:ro
    logging: *default-logging
    networks: [datanet]

  # =========================================================
  # MENSAGERIA (profile: stream)
  # =========================================================

  # Kafka em modo KRaft (sem Zookeeper), broker + controller no mesmo nó
  kafka:
    image: apache/kafka:4.2.1
    profiles: ["stream"]
    restart: unless-stopped
    hostname: kafka
    environment:
      CLUSTER_ID: Q2FzZVNhdWRlS2Fma2EwMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT: tráfego interno entre containers | EXTERNAL: acesso a partir do host
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Nó único: fator de replicação 1 (em produção: 3 brokers, RF=3, min.insync=2)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Tópicos são criados explicitamente (governança), não por acidente
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536m
    logging: *default-logging
    networks: [datanet]

  # Cria os tópicos do projeto e encerra
  kafka-init:
    image: apache/kafka:4.2.1
    profiles: ["stream"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init-topics.sh"]
    volumes:
      - ./scripts:/scripts:ro
    logging: *default-logging
    networks: [datanet]

  # Kafka Connect com os conectores do Debezium (CDC do PostgreSQL)
  kafka-connect:
    image: quay.io/debezium/connect:3.5.2.Final
    profiles: ["stream"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      HEAP_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "${KAFKA_CONNECT_PORT}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536m
    logging: *default-logging
    networks: [datanet]

  # Interface web do Kafka (tópicos, mensagens, consumer lag, conectores)
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    profiles: ["stream"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: case-saude
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "false"
      # Tela de login (a UI permite ler mensagens com dados sensíveis)
      AUTH_TYPE: LOGIN_FORM
      # Mascara campos pessoais ao exibir mensagens dos tópicos de saúde
      KAFKA_CLUSTERS_0_MASKING_0_TYPE: MASK
      KAFKA_CLUSTERS_0_MASKING_0_FIELDS_0: cpf
      KAFKA_CLUSTERS_0_MASKING_0_FIELDS_1: nome
      KAFKA_CLUSTERS_0_MASKING_0_FIELDS_2: telefone
      KAFKA_CLUSTERS_0_MASKING_0_FIELDS_3: email
      KAFKA_CLUSTERS_0_MASKING_0_FIELDS_4: endereco
      KAFKA_CLUSTERS_0_MASKING_0_TOPICVALUESPATTERN: "saude\\..*"
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD}
    ports:
      - "${KAFKA_UI_PORT}:8080"
    deploy:
      resources:
        limits:
          memory: 768m
    logging: *default-logging
    networks: [datanet]

  # =========================================================
  # PROCESSAMENTO (profile: processing)
  # =========================================================

  spark-master:
    <<: *spark-common
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      <<: *spark-env
      # O driver dos jobs de teste roda aqui (client mode) e acessa o DW
      DW_DB_PASSWORD: ${DW_DB_PASSWORD}
      # Chave da pseudonimização (HMAC): só o driver precisa dela
      PII_HMAC_KEY: ${PII_HMAC_KEY}
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging

  # Workers escalam horizontalmente: make scale-workers n=3
  spark-worker:
    <<: *spark-common
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES}", "--memory", "${SPARK_WORKER_MEMORY}",
              "--webui-port", "8081"]
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS}
      resources:
        limits:
          memory: 2560m
    logging: *default-logging

  # =========================================================
  # ORQUESTRAÇÃO (profile: orchestration)
  # =========================================================

  # Migra o banco de metadados, cria o usuário admin e encerra
  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: ["version"]
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # Interface web + API REST + Execution API (usada pelas tasks)
  airflow-apiserver:
    <<: *airflow-common
    command: ["api-server"]
    ports:
      - "${AIRFLOW_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1536m
    logging: *default-logging

  # Scheduler com LocalExecutor: as tasks (e o driver Spark) rodam aqui
  airflow-scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler
    command: ["scheduler"]
    environment:
      <<: *airflow-env
      # Credenciais usadas pelo driver Spark para acessar o Silo e o DW
      AWS_ACCESS_KEY_ID: svc-pipeline
      AWS_SECRET_ACCESS_KEY: ${SILO_PIPELINE_SECRET}
      AWS_REGION: us-east-1
      DW_DB_PASSWORD: ${DW_DB_PASSWORD}
      PII_HMAC_KEY: ${PII_HMAC_KEY}
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 3g
    logging: *default-logging

  # Recebe as métricas StatsD do Airflow e as expõe ao Prometheus
  statsd-exporter:
    image: prom/statsd-exporter:v0.31.0
    profiles: ["orchestration"]
    restart: unless-stopped
    command: ["--statsd.mapping-config=/etc/statsd/mapping.yml"]
    volumes:
      - ./config/statsd:/etc/statsd:ro
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *default-logging
    networks: [datanet]

  # Lê e interpreta os arquivos de DAG
  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging

  # =========================================================
  # BI (profile: bi)
  # =========================================================

  # Metabase (versão LTS) — dashboards sobre a camada gold do DW
  metabase:
    image: metabase/metabase:v0.58.31.x
    profiles: ["bi"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Banco de metadados do próprio Metabase
      MB_DB_CONNECTION_URI: postgres://postgres:5432/metabase?user=metabase&password=${METABASE_DB_PASSWORD}&sslmode=require
      # Criptografa as credenciais das fontes de dados salvas pelo Metabase
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY}
      # Privacidade: sem telemetria para terceiros
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_TIMEZONE: America/Sao_Paulo
      JAVA_OPTS: "-Xmx1g"
    ports:
      - "${METABASE_PORT}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1536m
    logging: *default-logging
    networks: [datanet]

  # =========================================================
  # OBSERVABILIDADE (profile: observability)
  # =========================================================

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging
    networks: [datanet]

  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/visao-geral.json
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *default-logging
    networks: [datanet]

  # Armazena os logs de todos os containers (retenção de 7 dias)
  loki:
    image: grafana/loki:3.7.8
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./config/loki:/etc/loki:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging
    networks: [datanet]

  # Coletor de logs: lê os logs dos containers via API do Docker e envia ao Loki
  alloy:
    image: grafana/alloy:v1.19.2
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config/alloy:/etc/alloy:ro
      # Acesso somente leitura à API do Docker (ver considerações de segurança no README)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *default-logging
    networks: [datanet]

  # Métricas de CPU, memória, rede e disco de cada container
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: ["observability"]
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *default-logging
    networks: [datanet]

  # Tópicos, offsets e consumer lag do Kafka
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092", "--kafka.version=3.6.0"]
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *default-logging
    networks: [datanet]

  # Estatísticas do PostgreSQL (conexões, tamanho, transações)
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=require
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *default-logging
    networks: [datanet]

  # =========================================================
  # SPEED LAYER (profile: speed)
  # =========================================================

  # Structured Streaming permanente: Kafka -> bronze -> silver -> serving no DW
  spark-streaming:
    <<: *spark-common
    profiles: ["speed"]
    hostname: spark-streaming
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --name
      - speed-layer-eventos-saude
      - --driver-memory
      - 1g
      # Núcleos reservados à speed layer (padrão: 2 de 4), o restante fica para os jobs em lote.
      # Para escalar: aumente SPARK_WORKER_REPLICAS e SPARK_STREAMING_CORES (até 9 = total de partições dos tópicos)
      - --conf
      - spark.cores.max=${SPARK_STREAMING_CORES}
      - --conf
      - spark.executor.cores=1
      - --conf
      - spark.executor.memory=1g
      - --conf
      - spark.sql.shuffle.partitions=4
      # O Delta reconstrói o estado de cada tabela com 50 partições por padrão (pensado para
      # clusters grandes); com 2 núcleos, isso vira dezenas de tarefas minúsculas a cada gravação
      - --conf
      - spark.databricks.delta.snapshotPartitions=2
      # Reaproveita os processos Python dos executores entre lotes (UDF de pseudonimização)
      - --conf
      - spark.python.worker.reuse=true
      - --py-files
      - /opt/jobs/common/mascaramento.py
      - /opt/jobs/streaming/speed_layer.py
    environment:
      <<: *spark-env
      PII_HMAC_KEY: ${PII_HMAC_KEY}
      DW_DB_PASSWORD: ${DW_DB_PASSWORD}
      STATSD_HOST: statsd-exporter
      # Intervalo do micro-batch. Medido neste ambiente: lotes de 10 s levavam ~17 s (atraso
      # crescente); lotes de 30 s levam ~13 s (latência média ~28 s, estável). O custo por
      # lote é quase todo fixo (commits transacionais no Delta), então lotes maiores diluem esse custo.
      INTERVALO_LOTE: ${SPEED_INTERVALO_LOTE:-30 seconds}
    ports:
      - "${SPARK_STREAMING_UI_PORT}:4040"
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      silo-init:
        condition: service_completed_successfully
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4040')"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g
    logging: *default-logging

  # =========================================================
  # SIMULAÇÃO (profile: simulation — ligado sob demanda: make gerador-start)
  # =========================================================

  gerador:
    build:
      context: ./generator
    image: case-saude/gerador:1.0
    profiles: ["simulation"]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      EVENTOS_POR_SEGUNDO: ${GERADOR_EVENTOS_POR_SEGUNDO}
      TAXA_INVALIDOS: ${GERADOR_TAXA_INVALIDOS}
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *default-logging
    networks: [datanet]

networks:
  datanet:
    name: case-saude-net

volumes:
  pg_data:
  silo_data:
  kafka_data:
  airflow_logs:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
